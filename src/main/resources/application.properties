server.port=8080
# Target base URL (MercadoLibre API). Can be changed for testing.
proxy.target-base-url=https://api.mercadolibre.com

# Default content type to apply when upstream does not return Content-Type.
# Leave blank to disable (the proxy will not add any Content-Type header).
proxy.default-content-type=application/json

# Use a PKCS12 keystore bundled in the classpath for HTTPS during local testing
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=proxymeli123
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=proxy_cert

# Admin credentials for HTTP Basic auth protecting /admin/**
# WARNING: for local/dev only. Password is stored in plain text and used with {noop} encoder.
admin.username=admin
admin.password=proxymeli123

# Increase Reactor Netty threads if needed for load testing (tweak based on environment)
# reactor.netty.ioWorkerCount=200

# Expose actuator endpoints
#management.endpoints.web.exposure.include=health,info

# Disable reactive security auto-configuration so we control security via SecurityConfig
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
